<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SAR 실시간 지도</title>
<style>
  body { margin:0; background:#111; color:#ddd; font-family:monospace;
         display:flex; flex-direction:column; align-items:center; }
  h3 { margin:10px 0 4px; font-weight:normal; }
  #meta { font-size:12px; color:#8a8; margin-bottom:6px; }
  img { max-width:96vw; max-height:88vh; image-rendering:auto;
        border:1px solid #333; }
</style>
</head>
<body>
<h3>Search &amp; Rescue — 실시간 지도 (5초마다 갱신)</h3>
<div id="meta">로봇이 SPIN을 마치면 첫 지도가 나타납니다…</div>
<img id="map" src="out/live_map.png" alt="지도 대기 중">
<script>
  const img = document.getElementById("map");
  const meta = document.getElementById("meta");
  let ok = 0;
  img.onload = () => { ok++; meta.textContent =
      "갱신 " + ok + "회 · " + new Date().toLocaleTimeString(); };
  img.onerror = () => { meta.textContent = "지도 파일 대기 중…"; };
  setInterval(() => { img.src = "out/live_map.png?t=" + Date.now(); }, 2000);
</script>
</body>
</html>
